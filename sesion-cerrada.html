<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLANIFY - Has cerrado sesion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Barra simple: solo el logo, porque ya no hay sesion abierta -->
  <header class="barra-superior">
    <a class="logo" href="index.html">
      <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="55" cy="55" r="38" fill="var(--ciruela)" opacity=".65"/>
        <circle cx="38" cy="42" r="30" fill="var(--violeta)" opacity=".8"/>
      </svg>
      <span>PLANIFY</span>
    </a>
  </header>

  <main style="display:flex; align-items:center; justify-content:center; padding:60px 20px;">
    <div class="tarjeta-despedida">
      <div class="circulo-chau"><i class="fa-solid fa-hand"></i></div>

      <h2>Has cerrado sesion</h2>
      <p>Tus notas, tareas y recordatorios quedaron guardados. Cuando quieras, volve a entrar.</p>

      <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center;">
        <a class="boton boton-vino" href="iniciar-sesion.html" style="min-width:180px;">
          <i class="fa-solid fa-right-to-bracket"></i> Volver a iniciar sesion
        </a>
        <a class="boton boton-violeta" href="index.html" style="min-width:150px;">
          <i class="fa-solid fa-house"></i> Ir al inicio
        </a>
      </div>

      <p style="margin-top:26px; margin-bottom:0; font-size:13px;">
        Gracias por usar PLANIFY <i class="fa-solid fa-heart" style="color:var(--vino);"></i>
      </p>
    </div>
  </main>

  <footer class="pie">PLANIFY 2026 &middot; Proyecto de Modelos y Sistemas</footer>
</body>
</html>
